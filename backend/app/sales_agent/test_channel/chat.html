<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sales Agent test channel</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f2f2f2; margin: 0; padding: 20px; }
    .page { max-width: 640px; margin: 0 auto; }
    h1 { font-size: 20px; margin: 0 0 4px; }
    .hint { color: #666; font-size: 13px; margin: 0 0 12px; }
    .top-row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
    .top-row input { flex: 1; padding: 8px; font-size: 14px; }
    #chat-window { background: white; border: 1px solid #ccc; border-radius: 6px; height: 420px; overflow-y: auto; padding: 12px; }
    .message { max-width: 80%; padding: 8px 12px; margin: 6px 0; border-radius: 12px; white-space: pre-wrap; }
    .message.customer { background: #dcf8c6; margin-left: auto; }
    .message.agent { background: #eeeeee; margin-right: auto; }
    .status { color: #888; font-style: italic; font-size: 13px; margin: 6px 0; }
    .error { color: #b00020; font-size: 13px; margin: 6px 0; }
    .send-row { display: flex; gap: 8px; margin-top: 8px; }
    .send-row textarea { flex: 1; padding: 8px; font-size: 14px; resize: none; }
    button { padding: 8px 16px; font-size: 14px; cursor: pointer; }
  </style>
</head>
<body>
  <div class="page">
    <h1>Sales Agent test channel</h1>
    <p class="hint">You are the customer. Conversations are saved in the database, so they survive a restart. Change the phone number to act as a different customer.</p>

    <div class="top-row">
      <label for="phone-input">Customer phone:</label>
      <input id="phone-input" value="+10000000001">
      <button id="clear-button">Clear this chat</button>
    </div>

    <div id="chat-window"></div>

    <div class="send-row">
      <textarea id="message-input" rows="2" placeholder="Type a message. Enter sends, Shift+Enter adds a new line."></textarea>
      <button id="send-button">Send</button>
    </div>
  </div>

  <script>
    const phoneInput = document.getElementById("phone-input");
    const chatWindow = document.getElementById("chat-window");
    const messageInput = document.getElementById("message-input");
    const sendButton = document.getElementById("send-button");
    const clearButton = document.getElementById("clear-button");

    const POLL_EVERY_MS = 1000;
    const GIVE_UP_AFTER_MS = 150000;

    function currentPhone() {
      return phoneInput.value.trim();
    }

    function sleep(milliseconds) {
      return new Promise((resolve) => setTimeout(resolve, milliseconds));
    }

    function scrollToBottom() {
      chatWindow.scrollTop = chatWindow.scrollHeight;
    }

    function addMessage(role, text) {
      const bubble = document.createElement("div");
      bubble.className = "message " + (role === "user" ? "customer" : "agent");
      bubble.textContent = text;  // textContent (not innerHTML), so typed text can never run as code
      chatWindow.appendChild(bubble);
      scrollToBottom();
    }

    function addNote(cssClass, text) {
      const note = document.createElement("div");
      note.className = cssClass;
      note.textContent = text;
      chatWindow.appendChild(note);
      scrollToBottom();
      return note;
    }

    // The backend answers errors as {"error": {"message": "..."}}.
    async function readErrorMessage(response) {
      try {
        const body = await response.json();
        return body.error.message;
      } catch (problem) {
        return "Something went wrong (status " + response.status + ").";
      }
    }

    async function loadHistory() {
      chatWindow.innerHTML = "";
      if (!currentPhone()) return;
      const response = await fetch("/sales/test-channel/history/" + encodeURIComponent(currentPhone()));
      if (!response.ok) {
        addNote("error", await readErrorMessage(response));
        return;
      }
      const body = await response.json();
      body.messages.forEach((message) => addMessage(message.role, message.text));
    }

    // The agent answers in the background, so we ask for new messages until a reply from the agent shows up.
    async function waitForReply(conversationId, afterMessageId) {
      const deadline = Date.now() + GIVE_UP_AFTER_MS;
      while (Date.now() < deadline) {
        await sleep(POLL_EVERY_MS);
        const response = await fetch("/sales/conversations/" + conversationId + "/messages?after=" + afterMessageId);
        if (!response.ok) throw new Error(await readErrorMessage(response));
        const body = await response.json();
        const replies = body.messages.filter((message) => message.direction === "OUT");
        if (replies.length > 0) return replies;
      }
      return null;
    }

    async function sendMessage() {
      const text = messageInput.value.trim();
      if (!text || !currentPhone()) return;

      addMessage("user", text);
      messageInput.value = "";
      sendButton.disabled = true;
      let typingNote = null;

      try {
        // crypto.randomUUID is the message id; sending the same id twice would not make the agent answer twice.
        const response = await fetch("/sales/test-channel/messages", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ phone: currentPhone(), message_id: crypto.randomUUID(), text: text }),
        });
        if (!response.ok) {
          addNote("error", await readErrorMessage(response));
          return;
        }
        const received = await response.json();
        typingNote = addNote("status", "Sales Agent is typing...");
        const replies = await waitForReply(received.conversation_id, received.message_id);
        typingNote.remove();
        if (replies === null) {
          addNote("error", "No reply yet. The agent may still be working. Reload the page to check.");
        } else {
          replies.forEach((reply) => addMessage("assistant", reply.text));
        }
      } catch (problem) {
        if (typingNote) typingNote.remove();
        addNote("error", "Could not reach the backend. Is it running?");
      } finally {
        sendButton.disabled = false;
        messageInput.focus();
      }
    }

    async function clearChat() {
      if (!currentPhone()) return;
      await fetch("/sales/test-channel/history/" + encodeURIComponent(currentPhone()), { method: "DELETE" });
      loadHistory();
    }

    sendButton.addEventListener("click", sendMessage);
    clearButton.addEventListener("click", clearChat);
    phoneInput.addEventListener("change", loadHistory);
    messageInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        sendMessage();
      }
    });

    loadHistory();
  </script>
</body>
</html>
